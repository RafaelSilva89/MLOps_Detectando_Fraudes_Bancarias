<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="876" viewBox="0 0 1240 876" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">Arquitetura geral · detecção de fraudes</title><desc id="d">Visão resumida: params.yaml alimenta os 8 estágios do DVC (load_data, validate_data, preprocess_data, engineer_features, train, decision_policy, evaluate, monitor); os estágios 5 a 8 gravam numa run do MLflow; register_model cria a versão fraude_xgboost @champion; o FraudPredictor (validar, features, probabilidade, regra) serve CLI, Flask e Docker; Airflow, Git + DVC e pytest + GitHub Actions dão orquestração, reprodutibilidade e qualidade.</desc><defs>
<marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker>
<marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#107C10"/></marker>
<marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8661C5"/></marker>
<marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CA5010"/></marker>
<marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C50F1F"/></marker>
<marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#243A5E"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="876" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="620" y="32" font-size="20" fill="#243A5E" font-weight="bold" text-anchor="middle">Arquitetura geral · do dado bruto à previsão servida</text>
<text x="620" y="54" font-size="12.5" fill="#7A7A7A" font-weight="normal" text-anchor="middle">visão resumida; o diagrama completo, com todas as pastas, está em docs/arquitetura.svg</text>
<rect x="170" y="70" width="1050" height="30" rx="5" fill="#FFF8E5" stroke="#C19C00" stroke-width="1.4"/>
<text x="185" y="90" font-size="13" fill="#7A5C00" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace">params.yaml</text>
<text x="285" y="90" font-size="11.5" fill="#7A5C00" font-weight="normal" text-anchor="start">todos os parâmetros num lugar só (semente, split, modelos, busca, custos, monitoramento): cada estágio lê as chaves de que precisa</text>
<rect x="20" y="125" width="135" height="96" rx="6" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="87" y="150" font-size="11.5" fill="#243A5E" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">transferencias.zip</text>
<text x="87" y="170" font-size="11" fill="#7A7A7A" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">data/external/</text>
<text x="87" y="190" font-size="11" fill="#7A7A7A" font-weight="normal" text-anchor="middle">versionado</text>
<text x="87" y="205" font-size="11" fill="#7A7A7A" font-weight="normal" text-anchor="middle">pelo DVC</text>
<rect x="170" y="125" width="245" height="96" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.6"/>
<rect x="170" y="125" width="5" height="96" rx="2" fill="#0078D4" stroke="#0078D4" stroke-width="0"/>
<text x="183" y="144" font-size="13" fill="#243A5E" font-weight="bold" text-anchor="start">1 · load_data</text>
<text x="183" y="163" font-size="11.5" fill="#3B3B3B" font-weight="normal" text-anchor="start">lê o CSV de dentro do zip</text>
<text x="183" y="179" font-size="11" fill="#0078D4" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">→ data/raw/raw.csv</text>
<rect x="438" y="125" width="245" height="96" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.6"/>
<rect x="438" y="125" width="5" height="96" rx="2" fill="#0078D4" stroke="#0078D4" stroke-width="0"/>
<text x="451" y="144" font-size="13" fill="#243A5E" font-weight="bold" text-anchor="start">2 · validate_data</text>
<text x="451" y="163" font-size="11.5" fill="#3B3B3B" font-weight="normal" text-anchor="start">colunas, tipos, nulos, faixas</text>
<text x="451" y="179" font-size="11.5" fill="#C50F1F" font-weight="normal" text-anchor="start">falhou? o pipeline PARA</text>
<rect x="706" y="125" width="245" height="96" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.6"/>
<rect x="706" y="125" width="5" height="96" rx="2" fill="#0078D4" stroke="#0078D4" stroke-width="0"/>
<text x="719" y="144" font-size="13" fill="#243A5E" font-weight="bold" text-anchor="start">3 · preprocess_data</text>
<text x="719" y="163" font-size="11.5" fill="#3B3B3B" font-weight="normal" text-anchor="start">sem duplicatas · split 60/20/20</text>
<text x="719" y="179" font-size="11" fill="#0078D4" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">→ data/preprocessed/</text>
<rect x="974" y="125" width="245" height="96" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.6"/>
<rect x="974" y="125" width="5" height="96" rx="2" fill="#0078D4" stroke="#0078D4" stroke-width="0"/>
<text x="987" y="144" font-size="13" fill="#243A5E" font-weight="bold" text-anchor="start">4 · engineer_features</text>
<text x="987" y="163" font-size="11.5" fill="#3B3B3B" font-weight="normal" text-anchor="start">hora_do_dia, sem Timestamp</text>
<text x="987" y="179" font-size="11" fill="#0078D4" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">→ data/processed/</text>
<rect x="170" y="265" width="245" height="110" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.6"/>
<rect x="170" y="265" width="5" height="110" rx="2" fill="#0078D4" stroke="#0078D4" stroke-width="0"/>
<text x="183" y="284" font-size="13" fill="#243A5E" font-weight="bold" text-anchor="start">5 · train</text>
<text x="183" y="303" font-size="11.5" fill="#3B3B3B" font-weight="normal" text-anchor="start">4 algoritmos, CV, Random Search</text>
<text x="183" y="319" font-size="11" fill="#107C10" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">→ models/*.joblib</text>
<rect x="438" y="265" width="245" height="110" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.6"/>
<rect x="438" y="265" width="5" height="110" rx="2" fill="#0078D4" stroke="#0078D4" stroke-width="0"/>
<text x="451" y="284" font-size="13" fill="#243A5E" font-weight="bold" text-anchor="start">6 · decision_policy</text>
<text x="451" y="303" font-size="11.5" fill="#3B3B3B" font-weight="normal" text-anchor="start">limiar + regra de valor (validação)</text>
<text x="451" y="319" font-size="11" fill="#107C10" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">→ artifacts/decision_policy.json</text>
<rect x="706" y="265" width="245" height="110" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.6"/>
<rect x="706" y="265" width="5" height="110" rx="2" fill="#0078D4" stroke="#0078D4" stroke-width="0"/>
<text x="719" y="284" font-size="13" fill="#243A5E" font-weight="bold" text-anchor="start">7 · evaluate</text>
<text x="719" y="303" font-size="11.5" fill="#3B3B3B" font-weight="normal" text-anchor="start">teste aberto uma vez · SLA</text>
<text x="719" y="319" font-size="11" fill="#8661C5" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">→ metrics/evaluation.json</text>
<text x="719" y="335" font-size="11" fill="#107C10" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">→ models/model_card.json</text>
<rect x="974" y="265" width="245" height="110" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.6"/>
<rect x="974" y="265" width="5" height="110" rx="2" fill="#0078D4" stroke="#0078D4" stroke-width="0"/>
<text x="987" y="284" font-size="13" fill="#243A5E" font-weight="bold" text-anchor="start">8 · monitor</text>
<text x="987" y="303" font-size="11.5" fill="#3B3B3B" font-weight="normal" text-anchor="start">drift (PSI/K-S) · lotes × SLA</text>
<text x="987" y="319" font-size="11" fill="#8661C5" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">→ metrics/monitoring.json</text>
