<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="dd-t dd-d" font-family="Segoe UI, IBM Plex Sans, Arial, sans-serif">
<title id="dd-t">Quem lê cada parte dos dados</title>
<desc id="dd-d">A base sem duplicatas é separada em treino (60%), validação (20%) e teste (20%), de forma estratificada. O treino é lido pelo estágio de treinamento; treino mais validação alimentam a validação cruzada e o modelo final; a validação, com o modelo treinado só no treino, escolhe o limiar de decisão; o teste só é lido uma vez, no estágio de avaliação; o monitoramento usa a base inteira, dividida pelo tempo. Nenhuma escolha olha o teste.</desc>
<defs>
  <marker id="dd-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker>
  <marker id="dd-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0A8A94"/></marker>
  <marker id="dd-a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C50F1F"/></marker>
  <marker id="dd-a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8661C5"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="620" fill="#FFFFFF"/>
<text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#243A5E">Quem lê cada parte dos dados (e por que isso evita vazamento)</text>
<text x="600" y="56" text-anchor="middle" font-size="13" fill="#505050">Exemplo real: 283.726 transações sem duplicatas, 0,17% de fraudes, separação estratificada com semente 42</text>

<!-- barra da base -->
<text x="40" y="96" font-size="13" font-weight="700" fill="#243A5E">data/preprocessed/ (saída da fase 6)</text>
<rect x="40" y="108" width="660" height="56" rx="6" fill="#DCEBFA" stroke="#0078D4" stroke-width="1.6"/>
<text x="370" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0E1619">train.csv · 60%</text>
<text x="370" y="152" text-anchor="middle" font-size="12" fill="#505050">170.235 transações · 284 fraudes</text>
<rect x="700" y="108" width="220" height="56" rx="6" fill="#DDF1F2" stroke="#0A8A94" stroke-width="1.6"/>
<text x="810" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0E1619">val.csv · 20%</text>
<text x="810" y="152" text-anchor="middle" font-size="12" fill="#505050">56.745 · 94 fraudes</text>
<rect x="920" y="108" width="240" height="56" rx="6" fill="#FBE3E5" stroke="#C50F1F" stroke-width="1.6"/>
<text x="1040" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0E1619">test.csv · 20%</text>
<text x="1040" y="152" text-anchor="middle" font-size="12" fill="#505050">56.746 · 95 fraudes · trancado</text>


<!-- estágios -->
<g font-size="13">
  <rect x="40" y="226" width="250" height="100" rx="8" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.6"/>
  <text x="56" y="250" font-weight="700" fill="#243A5E">F8 · train</text>
  <text x="56" y="272" fill="#505050" font-size="12">compara algoritmos e ajusta</text>
  <text x="56" y="290" fill="#505050" font-size="12">hiperparâmetros (CV no treino)</text>
  <text x="56" y="312" fill="#0A6A72" font-size="11.5" font-family="Consolas, monospace">→ model_validation.joblib</text>

  <rect x="320" y="226" width="250" height="100" rx="8" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.6"/>
  <text x="336" y="250" font-weight="700" fill="#243A5E">F8 · modelo final</text>
  <text x="336" y="272" fill="#505050" font-size="12">CV de 5 dobras e retreino em</text>
  <text x="336" y="290" fill="#505050" font-size="12">treino + validação (80%)</text>
  <text x="336" y="312" fill="#0A6A72" font-size="11.5" font-family="Consolas, monospace">→ model.joblib</text>

  <rect x="600" y="226" width="250" height="100" rx="8" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.6"/>
  <text x="616" y="250" font-weight="700" fill="#243A5E">F9 · decision_policy</text>
  <text x="616" y="272" fill="#505050" font-size="12">limiar de custo mínimo, com o</text>
  <text x="616" y="290" fill="#505050" font-size="12">modelo que NÃO viu a validação</text>
  <text x="616" y="312" fill="#0A6A72" font-size="11.5" font-family="Consolas, monospace">→ decision_policy.json</text>

  <rect x="880" y="226" width="280" height="100" rx="8" fill="#FFF5F5" stroke="#C50F1F" stroke-width="2"/>
  <text x="896" y="250" font-weight="700" fill="#C50F1F">F9 · evaluate (uma única vez)</text>
  <text x="896" y="272" fill="#505050" font-size="12">modelo final + regra escolhida</text>
  <text x="896" y="290" fill="#505050" font-size="12">bootstrap → SLA de produção</text>
  <text x="896" y="312" fill="#0A6A72" font-size="11.5" font-family="Consolas, monospace">→ evaluation.json · model_card</text>
</g>
<line x1="165" y1="166" x2="165" y2="222" stroke="#0078D4" stroke-width="2.4" marker-end="url(#dd-a1)"/>
<line x1="420" y1="166" x2="420" y2="222" stroke="#0078D4" stroke-width="2.4" marker-end="url(#dd-a1)"/>
<path d="M 760 166 C 760 196, 520 192, 500 222" fill="none" stroke="#0A8A94" stroke-width="2.4" marker-end="url(#dd-a2)"/>
<line x1="790" y1="166" x2="740" y2="222" stroke="#0A8A94" stroke-width="2.4" marker-end="url(#dd-a2)"/>
<line x1="1040" y1="166" x2="1040" y2="222" stroke="#C50F1F" stroke-width="2.6" marker-end="url(#dd-a3)"/>
<path d="M 165 326 L 165 346 L 725 346 L 725 330" fill="none" stroke="#8661C5" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#dd-a4)"/>
<text x="445" y="341" text-anchor="middle" font-size="11.5" fill="#8661C5" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">model_validation.joblib → escolhe o limiar na validação</text>
<path d="M 445 326 L 445 364 L 1020 364 L 1020 330" fill="none" stroke="#8661C5" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#dd-a4)"/>
<text x="732" y="382" text-anchor="middle" font-size="11.5" fill="#8661C5" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">model.joblib + decision_policy.json → avaliados no teste</text>
<path d="M 725 326 L 725 356 L 1000 356 L 1000 330" fill="none" stroke="#8661C5" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#dd-a4)"/>
<text x="40" y="400" font-size="12" fill="#505050">Antes de separar, as duplicatas saem (uma cópia no treino e outra no teste seria "cola"). <tspan font-family="Consolas, monospace" fill="#0A6A72">train_val_ids.csv</tspan> guarda a ordem de treino + validação, da qual a validação cruzada depende.</text>

<!-- monitor -->
<rect x="40" y="420" width="1120" height="76" rx="8" fill="#F7F4FC" stroke="#8661C5" stroke-width="1.6"/>
<text x="56" y="444" font-size="13" font-weight="700" fill="#8661C5">F15 · monitor: a base inteira, dividida pelo TEMPO (não pelo sorteio)</text>
<text x="56" y="466" font-size="12" fill="#505050">PSI e K-S do dia 2 contra o dia 1 · treino nas primeiras 36 h e avaliação nas últimas 12 h (simula prever o futuro) · lotes de 4 h comparados ao SLA</text>
<text x="56" y="484" font-size="12" fill="#505050">Ele não escolhe nada: só confere se o modelo continua valendo quando o tempo passa.</text>

<!-- regras -->
<text x="40" y="532" font-size="13" font-weight="700" fill="#243A5E">Regras que valem para qualquer projeto</text>
<text x="40" y="554" font-size="12.5" fill="#3B3B3B">① Separe antes de ajustar qualquer coisa que aprende com os dados (escala, SMOTE, codificação, peso da classe).   ② Toda escolha (algoritmo, hiperparâmetro,</text>
<text x="40" y="574" font-size="12.5" fill="#3B3B3B">limiar) usa treino ou validação.   ③ O teste é lido por um único estágio, uma única vez.   ④ Em dados com ordem no tempo, confira também uma separação temporal.</text>
</svg>
