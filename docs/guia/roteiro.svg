<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" width="1440" height="840" role="img" aria-labelledby="rot-t rot-d" font-family="Segoe UI, IBM Plex Sans, Arial, sans-serif" class="rot">
<title id="rot-t">Roteiro MLOps em 17 fases</title>
<desc id="rot-d">As 17 fases para transformar um projeto de Ciência de Dados em um projeto com MLOps, agrupadas em 5 partes: diagnóstico e planejamento, dados, modelo, produção e fechamento. Cada caixa mostra a fase, as pastas ou arquivos que ela cria e as ferramentas. As setas indicam a ordem de execução. A cor de cada caixa indica o estado: já feito (verde, com selo), esta fase (laranja), próxima fase (azul-petróleo tracejado) ou depois (cinza claro).</desc>
<style>
  .rot .bx rect.card { fill: #FFFFFF; stroke: #B8C4C8; stroke-width: 1.4; }
  .rot .bx .n { fill: #243A5E; font-weight: 700; font-size: 13px; }
  .rot .bx .tt { fill: #0E1619; font-weight: 600; font-size: 14px; }
  .rot .bx .pa { fill: #0A6A72; font-size: 11.5px; font-family: Consolas, "IBM Plex Mono", monospace; }
  .rot .bx .fe { fill: #5A6B70; font-size: 11.5px; }
  .rot .bx .ok { display: none; }
  .rot .bx.d-done rect.card { fill: #EAF6EF; stroke: #2E9E5B; stroke-width: 2; }
  .rot .bx.d-done .ok { display: inline; }
  .rot .bx.d-now rect.card { fill: #FFF1DE; stroke: #FF8A00; stroke-width: 4; }
  .rot .bx.d-now .tt, .rot .bx.d-now .n { fill: #B45309; }
  .rot .bx.d-next rect.card { fill: #E6F4F5; stroke: #0A8A94; stroke-width: 3; stroke-dasharray: 8 5; }
  .rot .bx.d-next .tt, .rot .bx.d-next .n { fill: #0A6A72; }
  .rot .bx.d-todo { opacity: .42; }
  .rot .lane { fill: #F3F6F7; stroke: #D3DBDE; }
  .rot .ln1 { fill: #243A5E; font-weight: 700; font-size: 13px; letter-spacing: .06em; }
  .rot .ln2 { fill: #0E1619; font-weight: 600; font-size: 15px; }
  .rot .seta { stroke: #5A6B70; stroke-width: 2; fill: none; }
</style>
